name: CI/CD Audit

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Verify Build
      run: npm run build
      env:
        # Provide dummy env vars so build doesn't fail if they are checked at build time
        UPSTASH_REDIS_REST_URL: 'https://dummy.upstash.io'
        UPSTASH_REDIS_REST_TOKEN: 'dummy'
        RESEND_API_KEY: 're_dummy'
